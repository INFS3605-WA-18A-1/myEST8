# Puts production back on an earlier deployment (run by hand from the Actions tab
# with that deployment's address or id, which `vercel ls --prod` or the Vercel
# dashboard lists). Migrations only ever add, so older code runs on the newer
# database; a change that removes something is a separate, deliberate step.
name: Rollback

on:
  workflow_dispatch:
    inputs:
      deployment:
        description: The deployment to put production back on (its URL or id)
        required: true
        type: string

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Roll back
        env:
          DEPLOYMENT: ${{ inputs.deployment }}
        run: npx vercel rollback "$DEPLOYMENT" --token "$VERCEL_TOKEN"
