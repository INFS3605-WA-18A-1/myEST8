# Test every change; deploy what lands on master (docs/vercel.md, "CI/CD").
#
#   pull request   ->  test, build
#   push to master -> test, build -> migrate-prod -> deploy-prod -> smoke
#
# There are no preview deployments: the one Supabase project is production, and a
# preview would run on its data. Add a staging project and a preview job to bring them back.
# Instead `build` runs production's `vercel build` on every change, without deploying it.
#
# `test` and `build` need no secrets: every external API is mocked, every test uses its
# own throwaway database on the Postgres service below, never a hosted one (see
# docs/testing.md), and `vercel build` runs offline. Only the jobs after them hold secrets, and a pull request from
# a fork never reaches them. Never switch this to `pull_request_target`: that
# would hand secrets to code from a fork.
#
# Third-party actions are pinned to a commit (the version is in the comment) and
# kept current by Dependabot.
name: CI

on:
  push:
    branches: [master, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request replaces the older run. A deploy in progress on master is never cut off.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # The same Postgres as `npm run db:start` runs locally. The tests make their own
      # database on it and apply supabase/migrations themselves. Docker picks a free
      # host port: a fixed one (54340) failed a run when the runner already held it.
      postgres:
        image: postgres:17-alpine
        ports:
          - 5432
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_INITDB_ARGS: --locale-provider=builtin --locale=C.UTF-8
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      # The service's host port is only known once the job runs, and a job's own env can't read it.
      - name: Point the tests at the Postgres service
        run: echo "TEST_DATABASE_URL=postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x # package.json needs >= 22.13
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm run test:unit

      - name: Cache Playwright's Chromium
        id: playwright
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Browser end-to-end tests
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # The same `vercel build` as deploy-prod, so a vercel.json Vercel refuses, or a function
  # missing a file the app reads at run time, fails here rather than after master's
  # migrations have run. It needs no Vercel account: the project settings are production's
  # (Other, Node.js 24.x) and the ids only name the output.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      - name: Build the Vercel function as production does
        run: |
          mkdir -p .vercel
          echo '{"projectId":"ci","orgId":"ci","settings":{"framework":null,"nodeVersion":"24.x"}}' > .vercel/project.json
          npx vercel build --prod

      - name: Check the function holds every file the app reads
        run: npx tsx scripts/check-vercel-function.ts

  # The first run applies every migration to the empty production database. If a
  # migration fails nothing is deployed. Use the session pooler's address (port
  # 5432, reachable over IPv4); Supabase's direct address is IPv6 only. Add
  # required reviewers to the `production` environment to approve each deploy.
  migrate-prod:
    needs: [test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Migrate the production database
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npx supabase db push --yes --db-url "$DB_URL"

  deploy-prod:
    needs: migrate-prod
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One production deploy at a time, in order; a newer one waits instead of cutting this one off.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Build and deploy to production
        run: |
          npx vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          npx vercel build --prod --token "$VERCEL_TOKEN"
          npx vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"

  # The deploy is live; check the app answers and reaches its database. A failure
  # here means: run the Rollback workflow.
  smoke:
    needs: deploy-prod
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_URL: ${{ vars.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: The landing page answers
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors --max-time 30 --output /dev/null "$APP_URL/"
      - name: The worker route refuses a caller without the secret
        run: |
          test "$(curl --silent --max-time 30 --output /dev/null --write-out '%{http_code}' "$APP_URL/api/cron/worker")" = 401
      - name: The worker runs, so the database is reachable
        run: |
          curl --fail --silent --show-error --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/worker"
