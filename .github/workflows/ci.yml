# Test every change; deploy what lands on master (docs/vercel.md, "CI/CD").
#
#   pull request   ->  test
#   push to master -> test -> migrate-prod -> deploy-prod -> smoke
#
# There are no preview deployments: the one Supabase project is production, and a
# preview would run on its data. Add a staging project and a preview job to bring them back.
#
# `test` needs no secrets: every external API is mocked, and every test uses its
# own throwaway database on the Postgres service below, never a hosted one (see
# docs/testing.md). Only the jobs after it hold secrets, and a pull request from
# a fork never reaches them. Never switch this to `pull_request_target`: that
# would hand secrets to code from a fork.
#
# Third-party actions are pinned to a commit (the version is in the comment) and
# kept current by Dependabot.
name: CI

on:
  push:
    branches: [master, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request replaces the older run. A deploy in progress on master is never cut off.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # The same Postgres as `npm run db:start` runs locally, on the same port. The
      # tests make their own database on it and apply supabase/migrations themselves.
      postgres:
        image: postgres:17-alpine
        ports:
          - 54340:5432
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_INITDB_ARGS: --locale-provider=builtin --locale=C.UTF-8
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:54340/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x # package.json needs >= 22.13
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm run test:unit

      - name: Cache Playwright's Chromium
        id: playwright
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Browser end-to-end tests
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # The first run applies every migration to the empty production database. If a
  # migration fails nothing is deployed. Use the session pooler's address (port
  # 5432, reachable over IPv4); Supabase's direct address is IPv6 only. Add
  # required reviewers to the `production` environment to approve each deploy.
  migrate-prod:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Migrate the production database
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npx supabase db push --yes --db-url "$DB_URL"

  deploy-prod:
    needs: migrate-prod
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One production deploy at a time, in order; a newer one waits instead of cutting this one off.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Build and deploy to production
        run: |
          npx vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          npx vercel build --prod --token "$VERCEL_TOKEN"
          npx vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"

  # The deploy is live; check the app answers and reaches its database. A failure
  # here means: run the Rollback workflow.
  smoke:
    needs: deploy-prod
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_URL: ${{ vars.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: The landing page answers
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors --max-time 30 --output /dev/null "$APP_URL/"
      - name: The worker route refuses a caller without the secret
        run: |
          test "$(curl --silent --max-time 30 --output /dev/null --write-out '%{http_code}' "$APP_URL/api/cron/worker")" = 401
      - name: The worker runs, so the database is reachable
        run: |
          curl --fail --silent --show-error --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/worker"
