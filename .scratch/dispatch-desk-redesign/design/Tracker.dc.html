    <div style="display: flex; gap: 8px">
      <label style="flex: 1; min-width: 0"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">Link</span><input type="text" readonly value="https://myest8.app/t/k3v9…" style="width: 100%; box-sizing: border-box; min-height: 44px; padding: 0 10px; border: 1px solid #7d8a95; border-radius: 4px; background: #f2f4f6; font: inherit"></label>

      <li><a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 4px; color: #13212e; text-decoration: none; border-bottom: 1px solid #d8dee4"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" style="width: 20px; height: 20px" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg>SMS</a></li>
      <li><a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 4px; color: #13212e; text-decoration: none; border-bottom: 1px solid #d8dee4"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" style="width: 20px; height: 20px" aria-hidden="true"><path d="M5 19l1.2-3.6A8 8 0 1 1 9 18.3z"></path></svg>WhatsApp</a></li>
      <li><a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 4px; color: #13212e; text-decoration: none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" style="width: 20px; height: 20px" aria-hidden="true"><circle cx="6" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="18" cy="12" r="1.5"></circle></svg>More options…</a></li>
    </ul>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"action":{"editor":"color","default":"#1f5c8b","options":["#1f5c8b","#13212e","#2f5a3e"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { action: this.props.action ?? '#1f5c8b' };
  }
}
</script>
</body>
